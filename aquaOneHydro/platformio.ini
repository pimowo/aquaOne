[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

lib_deps =
    symlink://../aquaOneCore

board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L

build_flags =
    -D HYDROSENSE_PLATFORM_ESP32S3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:native]
platform = native
test_framework = unity
test_filter = test_web_native_hydro
test_build_src = true
build_flags =
    -std=gnu++11
    -Itest/support
    -I../aquaOneCore/include
build_src_filter =
    -<*>
    +<native_test/AquaCoreNative.cpp>
    +<hardware/Pump.cpp>
    +<hardware/Buzzer.cpp>
    +<hardware/UltrasonicSensor.cpp>
    +<hydrosense/HydroSenseConfigValidator.cpp>
    +<web/HydroNativeWeb.cpp>
    +<web/HydroSenseApi.cpp>
    +<web/HydroSenseControlPage.cpp>
    +<web/HydroSenseDashboard.cpp>
    +<web/HydroSenseDiagnosticsPage.cpp>
    +<web/HydroSenseSettingsPage.cpp>
    +<web/HydroWebApplication.cpp>
    +<web/HydroWebProtocol.cpp>
