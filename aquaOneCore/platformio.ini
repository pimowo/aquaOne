[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
test_build_src = true

[env:native]
platform = native
test_framework = unity
test_filter = test_system, test_logging, test_storage, test_config, test_commands, test_safety, test_events, test_alarms, test_diagnostics_foundation, test_time_foundation, test_network_foundation, test_web_native_actions, test_web_auth
test_build_src = true
build_flags = -std=gnu++11
build_src_filter =
    -<*>
    +<System/>
    +<Logging/>
    +<Config/>
    +<Commands/>
    +<Events/>
    +<Diagnostics/DiagnosticsService.cpp>
    +<Web/WebTypes.cpp>
    +<Web/HttpStreamingReceive.cpp>
    +<Web/HttpBasicAuth.cpp>
    +<Web/HtmlShell.cpp>
    +<Web/CoreWebProjectionSources.cpp>
    +<Web/CoreWebProjectionPublisher.cpp>
    +<Web/NativeWebService.cpp>
    +<Web/WebStartup.cpp>
    +<Web/WebHealthProvider.cpp>
    +<Network/NetworkService.cpp>
    +<Network/NetworkStartup.cpp>
    +<Network/NetworkHealthProvider.cpp>
    +<Time/RtcService.cpp>
    +<Time/RtcWallClock.cpp>
    +<Time/NtpService.cpp>
    +<Time/NetworkNtpSync.cpp>
    -<System/Esp32SystemBackend.cpp>
    -<System/Esp32RestartReason.cpp>
    -<System/Esp32RuntimeIdentityGenerator.cpp>
    -<Logging/SerialLogSink.cpp>
