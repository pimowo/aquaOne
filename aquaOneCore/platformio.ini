[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
test_build_src = true

[env:native]
platform = native
test_framework = unity
test_filter = test_system, test_logging
test_build_src = true
build_flags = -std=gnu++11
build_src_filter =
    -<*>
    +<System/>
    +<Logging/>
    -<System/Esp32SystemBackend.cpp>
    -<System/Esp32RestartReason.cpp>
    -<Logging/SerialLogSink.cpp>
