[platformio]
default_envs = esp32_recovery_diag

[env:esp32_recovery_diag]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = symlink://../..
build_flags =
    -I../../test/test_web_realtime_resync_hil
    -Wl,--wrap=httpd_queue_work
    -Wl,--wrap=httpd_ws_send_frame_async
    -Wl,--wrap=httpd_sess_trigger_close
    -Wl,--wrap=httpd_stop
    -Wl,--wrap=httpd_start
